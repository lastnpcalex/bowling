<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vaporwave Bowling Score Tracker</title>
<!-- Vaporwave fonts & base reset -->
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
    --pink:#ff71ce;
    --blue:#01cdfe;
    --green:#05ffa1;
    --purple:#b967ff;
    --dark:#0d0221;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:'Press Start 2P',monospace;
    background:var(--dark);
    color:var(--green);
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:1rem;
}
/* neon container */
.neon-box{
    width:100%;
    max-width:960px;
    border:2px solid var(--pink);
    padding:1rem;
    border-radius:8px;
    background:rgba(255,255,255,0.02);
    box-shadow:0 0 12px var(--pink);
}
/* title */
.title-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:0.75rem;
    flex-wrap:wrap;
    margin-bottom:0.75rem;
}
h1{
    font-size:1.25rem;
    letter-spacing:1px;
    background:linear-gradient(90deg,var(--pink),var(--blue),var(--green));
    -webkit-background-clip:text;
    color:transparent;
}
/* frames grid */
.frames-container{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(70px,1fr));
    gap:4px;
    margin:.5rem 0;
}
.frame{
    background:#1a1a1a;
    border:2px solid var(--blue);
    border-radius:4px;
    padding:4px;
    text-align:center;
    position:relative;
}
.frame.selected{border-color:var(--pink)}
.tenth-frame{grid-column:span 2;}
.frame-top{
    display:flex;
    justify-content:space-between;
    font-size:.75rem;
}
.frame-bottom{
    margin-top:2px;
    font-size:.8rem;
    color:var(--green);
}
/* inputs & buttons */
.cyberpunk-button{
    background:var(--pink);
    color:var(--dark);
    border:none;
    border-radius:4px;
    padding:0.5rem 1rem;
    font-size:.8rem;
    margin:2px;
    cursor:pointer;
}
.cyberpunk-button:hover{filter:brightness(1.2)}
.text-input,.bowler-name{
    background:#1a1a1a;
    color:var(--green);
    border:2px solid var(--green);
    border-radius:4px;
    padding:4px;
    font-size:.8rem;
}
.input-area{
    display:none;
    flex-direction:column;
    align-items:center;
    margin-top:4px;
    gap:4px;
}
.input-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:4px;
    justify-content:center;
}
.input-buttons button{
    background:var(--blue);
    color:var(--dark);
    border:none;
    border-radius:4px;
    padding:4px 6px;
    font-size:.8rem;
    min-width:32px;
}
.roll-info{
    font-size:.8rem;
    color:var(--pink);
}
/* responsive tweaks */
@media(max-width:600px){
    .frames-container{grid-template-columns:repeat(auto-fit,minmax(58px,1fr))}
    h1{font-size:1rem}
}
</style>
</head>
<body>
<div class="neon-box">
    <div class="title-container">
        <h1>Vaporwave Bowling Score Tracker</h1>
    </div>
    <div class="instructions" style="text-align:center;margin-bottom:0.5rem;">
        <p>Tap a frame to enter or edit rolls. Use the buttons to add bowlers, start new games, and export your series.</p>
    </div>

    <div id="all-scoresheets-container"></div>

    <!-- controls -->
    <div style="display:flex;flex-wrap:wrap;justify-content:center;margin-top:0.5rem;">
        <input type="text" id="new-bowler-name" placeholder="Bowler name" class="text-input" style="margin:2px;width:160px;">
        <button id="add-bowler-button" class="cyberpunk-button">Add Bowler</button>
        <button id="new-game-button" class="cyberpunk-button">New Game For All</button>
        <button id="download-button" class="cyberpunk-button">Export JSON</button>
        <label for="load-game" class="cyberpunk-button" style="cursor:pointer;">Import JSON</label>
        <input type="file" id="load-game" style="display:none;" accept=".json">
    </div>
</div>
<script>
// ======= Data model =======
const games=[]; // array of game objects
let currentGameIndex=0;

// ======= Initialization =======
document.addEventListener('DOMContentLoaded',()=>{
    initializeGame(); // default bowler/game
    document.getElementById('add-bowler-button').onclick=addBowler;
    document.getElementById('new-game-button').onclick=addNewGameForAllBowlers;
    document.getElementById('download-button').onclick=downloadAllGames;
    document.getElementById('load-game').addEventListener('change',loadGames);
});

// ======= Game & UI creation =======
function initializeGame(bowlerName='Bowler 1'){
    const labelBase=`Game${getNextGameNumber(bowlerName)}_${getToday()}`;
    const game={
        bowlerName,
        gameInfo:labelBase,
        currentFrame:0,
        currentRoll:0,
        gameScores: Array.from({length:10},()=>({rolls:[],score:0})),
        container:null
    };
    games.push(game);
    currentGameIndex=games.length-1;
    createGameUI(game);
    selectFrame(game,0);
}
function getNextGameNumber(bowlerName){
    const numbers=games.filter(g=>g.bowlerName===bowlerName)
                       .map(g=>parseInt(g.gameInfo.match(/Game(\d+)/)?.[1]||1));
    return numbers.length?Math.max(...numbers)+1:1;
}
function createGameUI(game){
    const sheet=document.createElement('div');
    sheet.className='score-sheet';
    sheet.innerHTML=`
        <div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">
            <input class="bowler-name" value="${game.bowlerName}" style="width:140px;">
            <span style="color:var(--purple);font-size:.65rem;">${game.gameInfo}</span>
        </div>
        <div class="frames-container"></div>
        <div class="input-area">
            <div class="roll-info"></div>
            <div class="input-buttons"></div>
        </div>`;
    document.getElementById('all-scoresheets-container').appendChild(sheet);
    game.container=sheet;
    sheet.querySelector('.bowler-name').addEventListener('input',e=>game.bowlerName=e.target.value.trim());
    createFrames(game);
}
function createFrames(game){
    const fc=game.container.querySelector('.frames-container');
    for(let i=0;i<10;i++){
        const f=document.createElement('div');
        f.className='frame'+(i===9?' tenth-frame':'');
        f.innerHTML=`
            <div class="frame-top">
                <span class="roll1"></span><span class="roll2"></span>${i===9?'<span class="roll3"></span>':''}
            </div>
            <div class="frame-bottom"></div>`;
        f.addEventListener('click',()=>selectFrame(game,i));
        fc.appendChild(f);
    }
}
function selectFrame(game,idx){
    game.currentFrame=idx;
    game.currentRoll=0;
    game.container.querySelectorAll('.frame').forEach(f=>f.classList.remove('selected'));
    game.container.querySelectorAll('.frame')[idx].classList.add('selected');
    updateInputOptions(game);
    game.container.querySelector('.input-area').style.display='flex';
}

// ======= Input options =======
function updateInputOptions(game){
    const buttonsDiv=game.container.querySelector('.input-buttons');
    const rollInfoDiv=game.container.querySelector('.roll-info');
    buttonsDiv.innerHTML='';
    const frameIdx=game.currentFrame;
    const rollIdx=game.currentRoll;
    const frame=game.gameScores[frameIdx];
    const rolls=frame.rolls;
    let maxPins=10;
    if(frameIdx<9){
        if(rollIdx===1) maxPins=10-(rolls[0]||0);
    }else{
        // 10th frame logic
        if(rollIdx===1){
            if(rolls[0]!==10) maxPins=10-(rolls[0]||0);
        }
        if(rollIdx===2){
            if(rolls[0]===10 && rolls[1]!==10) maxPins=10-rolls[1];
            if(rolls[0]!==10 && (rolls[0]+rolls[1]===10)) maxPins=10;
        }
    }
    rollInfoDiv.textContent=`Frame ${frameIdx+1} - Roll ${rollIdx+1}`;
    for(let i=0;i<=maxPins;i++){
        // skip 10 pin button when invalid (same logic as previous)
        if(i===10 && rollIdx===1 && rolls[0]===0 && frameIdx<9) continue;
        const btn=document.createElement('button');
        btn.textContent=i===10?'X':i;
        btn.onclick=()=>handleRoll(game,i);
        buttonsDiv.appendChild(btn);
    }
    // spare button
    if(
        (frameIdx<9 && rollIdx===1 && rolls[0]<10) ||
        (frameIdx===9 && (
            (rollIdx===1 && rolls[0]!==10)||
            (rollIdx===2 && (rolls[0]===10||rolls[0]+rolls[1]===10))
        ))
    ){
        const spareBtn=document.createElement('button');
        spareBtn.textContent='/';
        spareBtn.onclick=()=>handleRoll(game,maxPins);
        buttonsDiv.appendChild(spareBtn);
    }
}

// ======= Roll handling & scoring =======
function handleRoll(game,pins){
    const fIdx=game.currentFrame;
    const rIdx=game.currentRoll;
    const frame=game.gameScores[fIdx];
    frame.rolls[rIdx]=pins;
    // advance logic
    if(fIdx<9){
        if(pins===10||rIdx===1){
            game.currentFrame=Math.min(fIdx+1,9);
            game.currentRoll=0;
        }else{
            game.currentRoll=1;
        }
    }else{
        // 10th
        if(rIdx===0){
            game.currentRoll=1;
        }else if(rIdx===1){
            if(frame.rolls[0]===10 || frame.rolls[0]+frame.rolls[1]===10){
                game.currentRoll=2;
            }else{
                game.currentRoll=0;
            }
        }else{
            game.currentRoll=0;
        }
    }
    calculateScores(game);
    updateInputOptions(game);
}
function calculateScores(game){
    let cumulative=0;
    for(let i=0;i<10;i++){
        const frame=game.gameScores[i];
        const rolls=frame.rolls;
        let frameScore;
        if(i<9){
            if(rolls[0]===10){ // strike
                const nextRolls=getNextTwoRolls(game,i);
                frameScore=10+nextRolls[0]+nextRolls[1];
            }else if((rolls[0]||0)+(rolls[1]||0)===10){ // spare
                frameScore=10+getNextRoll(game,i);
            }else{
                frameScore=(rolls[0]||0)+(rolls[1]||0);
            }
        }else{
            frameScore=(rolls[0]||0)+(rolls[1]||0)+(rolls[2]||0);
        }
        cumulative+=frameScore;
        frame.score=cumulative;
        updateFrameDisplay(game,i);
    }
}
function getNextRoll(game,idx){
    for(let j=idx+1;j<10;j++){
        const r=game.gameScores[j].rolls[0];
        if(r!==undefined) return r;
    }
    return 0;
}
function getNextTwoRolls(game,idx){
    const res=[];
    for(let j=idx+1;j<10&&res.length<2;j++){
        const rolls=game.gameScores[j].rolls;
        for(let k=0;k<rolls.length&&res.length<2;k++){
            if(rolls[k]!==undefined) res.push(rolls[k]);
        }
    }
    while(res.length<2) res.push(0);
    return res;
}

// ======= Display helpers =======
function updateFrameDisplay(game,idx){
    const frameDiv=game.container.querySelectorAll('.frame')[idx];
    const rolls=game.gameScores[idx].rolls;
    const spans=frameDiv.querySelectorAll('.roll1, .roll2, .roll3');
    spans.forEach((s,i)=>s.textContent=getSymbol(idx,i,rolls));
    frameDiv.querySelector('.frame-bottom').textContent=game.gameScores[idx].score||'';
}
function getSymbol(frameIdx,rollIdx,rolls){
    const val=rolls[rollIdx];
    if(val===undefined) return '';
    if(frameIdx===9){
        // 10th specific
        if(val===10) return 'X';
        if(rollIdx>0 && (rolls[rollIdx-1]+val===10) && val!==10) return '/';
        return val;
    }else{
        if(val===10) return 'X';
        if(rollIdx===1 && (rolls[0]+val===10)) return '/';
        return val;
    }
}

// ======= Controls =======
function addBowler(){
    const name=document.getElementById('new-bowler-name').value.trim();
    if(!name){alert('Enter a name');return;}
    document.getElementById('new-bowler-name').value='';
    initializeGame(name);
}
function addNewGameForAllBowlers(){
    const unique=[...new Set(games.map(g=>g.bowlerName))];
    unique.forEach(n=>initializeGame(n));
}
function downloadAllGames(){
    const data=games.map(g=>({
        bowler:g.bowlerName,
        label:g.gameInfo,
        frames:g.gameScores
    }));
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download='bowling_series_'+getToday()+'.json';
    a.click();
    URL.revokeObjectURL(url);
}
function loadGames(e){
    const files=e.target.files;
    Array.from(files).forEach(file=>{
        const reader=new FileReader();
        reader.onload=evt=>{
            try{
                const parsed=JSON.parse(evt.target.result);
                (Array.isArray(parsed)?parsed:[parsed]).forEach(g=>{
                    if(g.frames&&g.frames.length===10){
                        const newGame={
                            bowlerName:g.bowler||'Bowler',
                            gameInfo:g.label||`Game1_${getToday()}`,
                            currentFrame:0,
                            currentRoll:0,
                            gameScores:g.frames,
                            container:null
                        };
                        games.push(newGame);
                        createGameUI(newGame);
                        calculateScores(newGame);
                        selectFrame(newGame,0);
                    }
                });
            }catch(err){alert('Invalid JSON');}
        };
        reader.readAsText(file);
    });
    // reset input so same file can be re-selected later
    e.target.value='';
}

// ======= Utils =======
function getToday(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
</script>
</body>
</html>
